[package]
name = "para/db"
version = "0.3.0"
# The minimum noeta this package works with; enforced at resolve time from noeta 0.2.1 on.
toolchain = ">=0.4"
license = "MIT OR Apache-2.0"
description = "Database access with swappable drivers — SQLite and Postgres, bound parameters, migrations, and reactive queries."
keywords = ["database", "sqlite", "postgres", "sql", "migrations"]
# This package ships a native Rust extension crate (the `para.db` surface — the swappable-driver
# database layer, SQLite first). A consumer must authorize it under `[trust] native = ["para/db"]`.
# It also contributes the `noeta migrate` CLI command (para-extraction), which a consumer opts into
# by binding it a local name under `[trust.commands]` (`migrate = "para/db"`).
native = "native"
