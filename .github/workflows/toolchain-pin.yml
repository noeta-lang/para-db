name: Toolchain pin

# A noeta release dispatches `release-published` carrying its tag. This job answers two questions for
# this repo: does anything need to move, and does the package still compile.
#
# What may need to move is now of two kinds. The **contract crates** (`noeta-ext-abi`,
# `noeta-reactive-abi`) come from crates.io by RANGE, so a patch release is absorbed and needs no
# edit at all — a minor is not, and `"0.5"` has to become `"0.6"`. The **internal crates** a package
# reaches past the contract for (`noeta-loader`, `noeta-stdlib`, `noeta-conformance`) are unpublished
# and pinned by git tag, so they move on every release. Both are rewritten below, and the result is
# opened as a PR.
#
# **The PR is not the point; the build in this job is.** A `noeta` release is the moment this
# package's native half might stop compiling — a required field added to `ExtFn`, a signature that
# moved — and nothing else in the fleet asks that question on a schedule. So this job rewrites the
# pins and then *builds every crate against the new toolchain*, and the PR it opens carries the
# verdict. A release that breaks this package is visible within minutes of the tag instead of
# whenever someone next touches the repo.
#
# Verification runs HERE rather than being left to the PR's own checks for a concrete reason: a pull
# request opened with the default `GITHUB_TOKEN` does **not** trigger workflow runs (GitHub's
# recursion guard), so the PR would arrive with no checks at all. Doing the build in this job makes
# the signal independent of that. If a PAT is ever added for this, the PR's own CI becomes a second,
# fuller opinion — this one is deliberately the cheap early answer, not a replacement for it.
#
# What it will NOT touch, because these are semantic calls with consumer consequences and belong to
# a human: `toolchain = ">=X.Y"` in `noeta.toml` (does this package now REQUIRE the new toolchain?)
# and the package version (is dropping older toolchains a breaking change for consumers?). The PR
# body says so, so nobody merges it believing the release decision is made.
#
# A repo with nothing to rewrite — a pure-Noeta package, or a native one whose deps are all ranges on
# a patch release — still BUILDS. "Nothing to rewrite" is not "nothing to check", and gating the
# build on a manifest diff is how this job would quietly stop doing its job as the fleet moved to
# crates.io. Only the PR is conditional. This file is identical in all nine para repos.

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Toolchain tag to pin, e.g. v0.4.1"
        required: true
        type: string

concurrency:
  # One bump in flight per tag; a re-dispatch supersedes an earlier attempt at the same one.
  group: toolchain-pin-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.client_payload.tag || inputs.tag }}

jobs:
  bump:
    name: Pin the toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the pins
        id: bump
        run: |
          set -euo pipefail
          # A dispatch carries whatever the sender put in it. Refuse anything that is not a release
          # tag rather than rewriting manifests to a branch name or an empty string.
          case "${TAG:-}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing to pin '${TAG:-}': expected a release tag like v0.4.1"; exit 1 ;;
          esac

          # (a) GIT TAG PINS on the toolchain repo. These are the UNPUBLISHED internal crates —
          # `noeta-loader`, `noeta-stdlib`, `noeta-conformance` and friends — which carry no
          # stability promise and must move in lockstep with the toolchain. A package that reaches
          # past the contract has no other way to name them.
          mapfile -t PINNED < <(grep -rl 'github\.com/noeta-lang/noeta", tag = "' --include=Cargo.toml . || true)
          if [ "${#PINNED[@]}" -gt 0 ]; then
            printf 'repinning %d file(s) to %s:\n' "${#PINNED[@]}" "$TAG"
            printf '  %s\n' "${PINNED[@]}"
            sed -i -E 's|(github\.com/noeta-lang/noeta", tag = ")v[0-9][^"]*(")|\1'"$TAG"'\2|g' "${PINNED[@]}"
          fi

          # (b) CRATES.IO RANGES for the two contract crates. `noeta-ext-abi = "0.5"` admits every
          # 0.5.x, so a PATCH release needs no edit — that is the whole point of publishing them. A
          # MINOR release is a different matter: "0.5" does not admit 0.6.0, so the range has to
          # move, and nothing else in the fleet would notice until a human tried to build.
          MINOR="$(printf '%s' "${TAG#v}" | cut -d. -f1,2)"
          mapfile -t RANGED < <(grep -rlE '^noeta-(ext|reactive)-abi = "[0-9]' --include=Cargo.toml . || true)
          for f in "${RANGED[@]:-}"; do
            [ -n "$f" ] || continue
            # Only rewrite a range the new toolchain falls OUTSIDE of — a matching minor is left
            # exactly as written, so a patch release produces no diff and no PR.
            sed -i -E '/^noeta-(ext|reactive)-abi = "/ s|"[0-9]+\.[0-9]+"|"'"$MINOR"'"|' "$f"
          done

          if git diff --quiet; then
            echo "already current for $TAG — nothing to rewrite (the build below still runs)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # UNCONDITIONAL, and that is the point: "nothing to rewrite" is not "nothing to check". A
      # package whose deps are all crates.io ranges needs no edit for a patch release and would
      # otherwise skip the one job that asks whether the release broke it.
      - name: Build every crate against ${{ env.TAG }}
        id: verify
        # The question this job exists to answer. `clippy -D warnings` and not a bare `check`,
        # because it is what `ci.yml` enforces — an additive ABI change that turns an existing
        # `..DEFAULTS` tail into a no-op is a warning, and a warning is what would fail the real
        # gate. Each crate is its own workspace root (so the composed toolchain can adopt it as a
        # path dependency), hence the loop rather than `--workspace`.
        run: |
          set -uo pipefail
          rc=0
          {
            echo "| crate | result |"
            echo "| --- | --- |"
          } > /tmp/verdict.md
          for crate in crates/*/ native/; do
            [ -f "${crate}Cargo.toml" ] || continue
            # Never pipe the command whose exit code is the verdict — redirect, then read $?.
            (cd "${crate}" && cargo clippy --all-targets -- -D warnings) > "/tmp/$(echo "$crate" | tr '/' '_').log" 2>&1
            if [ $? -eq 0 ]; then
              echo "| \`${crate}\` | ✅ builds |" >> /tmp/verdict.md
            else
              echo "| \`${crate}\` | ❌ **fails** |" >> /tmp/verdict.md
              rc=1
              echo "::group::${crate} failed against ${TAG}"
              tail -60 "/tmp/$(echo "$crate" | tr '/' '_').log"
              echo "::endgroup::"
            fi
          done
          cat /tmp/verdict.md
          { echo "verdict<<EOF"; cat /tmp/verdict.md; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "ok=$([ $rc -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Do not exit non-zero yet: the PR below is how a FAILURE gets recorded somewhere a human
          # will see it. The job's own status is set at the end.

      - name: Open the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OK: ${{ steps.verify.outputs.ok }}
          VERDICT: ${{ steps.verify.outputs.verdict }}
        run: |
          set -euo pipefail
          BRANCH="toolchain-pin/${TAG}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -aqm "build: pin the toolchain crates to ${TAG}

          Opened by the \`release-published\` dispatch from noeta ${TAG}. Only the
          \`Cargo.toml\` tag pins moved; the \`toolchain\` floor in \`noeta.toml\` and this
          package's own version are deliberately untouched."
          git push -f origin "$BRANCH"

          if [ "$OK" = "true" ]; then
            TITLE="build: pin the toolchain to ${TAG}"
            HEAD="Every crate builds against \`${TAG}\`, so this is the mechanical half of the bump."
          else
            TITLE="build: pin the toolchain to ${TAG} — DOES NOT BUILD"
            HEAD="**This package does not compile against \`${TAG}\`.** The pin is bumped here so the
          failure is reproducible, but the PR needs a fix before it can merge — see the job log for
          the compiler output."
          fi

          BODY="$(cat <<EOB
          ${HEAD}

          ${VERDICT}

          Bumped automatically because \`ci.yml\`'s consistency guard fails while the pin and the
          org-level \`NOETA_VERSION\` disagree.

          **Left for a human, on purpose:**
          - \`toolchain = ">=X.Y"\` in \`noeta.toml\` — does this package now *require* the new
            toolchain? Raising that floor is breaking for consumers on the old one.
          - this package's version — a raised floor usually means a minor bump, not a patch.
          - whether this warrants a release at all. A published package pinned to an older tag still
            composes under a newer binary (the composer patches every toolchain crate to the running
            binary's source), so this is often CI hygiene rather than a compatibility fix.
          EOB
          )"

          # The verdict goes to the job summary FIRST, and unconditionally. Opening the PR is a
          # convenience that can be switched off at the org or repo level — "Allow GitHub Actions to
          # create and approve pull requests" is off by default — and the answer to "does this
          # package still build against the release" must not be lost to a settings checkbox.
          {
            echo "## Toolchain pin → \`${TAG}\`"
            echo
            echo "${BODY}"
            echo
            echo "Branch: \`${BRANCH}\` (pushed)"
          } >> "$GITHUB_STEP_SUMMARY"

          if gh pr create --title "$TITLE" --body "$BODY" --head "$BRANCH" \
               --base "${{ github.event.repository.default_branch }}" 2>/tmp/pr.err \
             || gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY" 2>>/tmp/pr.err; then
            echo "opened/updated the PR for $BRANCH"
          else
            # Not fatal. The branch is pushed and the verdict is in the summary above, so the work
            # survives; only the convenience wrapper is missing. Say exactly what to turn on.
            cat /tmp/pr.err
            COMPARE="${{ github.event.repository.html_url }}/compare/${BRANCH}?expand=1"
            echo "::warning title=Branch pushed, PR not opened::${BRANCH} is pushed and every crate's verdict is in the job summary, but this repo does not allow Actions to open pull requests. Open it at ${COMPARE} — or enable Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests'."
            echo "- Open the PR: ${COMPARE}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Not gated on `changed`: a package needing no rewrite can still be broken by the release, and
      # that is the case with no PR to carry the verdict — so the job's own red is the only signal.
      - name: Fail if the package does not build against the new toolchain
        if: steps.verify.outputs.ok != 'true'
        run: |
          if [ "${{ steps.bump.outputs.changed }}" = 'true' ]; then
            echo "::error::this package does not compile against ${TAG} — see the PR and the build log"
          else
            echo "::error::this package does not compile against ${TAG}, and needed no manifest change — so there is no PR; see the build log above"
          fi
          exit 1
