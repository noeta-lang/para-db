[package]
name = "noeta/para_db_demo"
version = "0.1.0"

[dependencies]
# The first-party non-default database package, keyed `para` so its native module addresses as
# `para.db` and its type as `para.db.Connection`.
para = [{ path = "../..", package = "para/db" }]

# The `@sql { … }` tier directive this demo writes. A tier is bound, never imported — and naming the
# package (rather than the `para` key) is what a scope array needs, since a key may cover several
# members. The `package =` claim above is what lets a path dependency be named this way.
[directives]
sql = "para/db"

# Default database wiring for `noeta migrate`: the migrations and (re-runnable) seeds directories.
[db]
migrations = "migrations"
seeds = "seeds"

# Running a package's native Rust code requires the root app to authorize it (Phase 4 trust gate);
# its CLI commands (`noeta migrate`) additionally require command trust.
[trust]
native = ["para/db"]

# Command trust binds each command to the local name it runs under, so the project decides what
# `noeta <name>` means: `migrate = "para/db"` is this package's own `migrate`.
[trust.commands]
migrate = "para/db"

[native]
# A `--native` binary picks its driver at runtime; request the Postgres driver ring so the AOT build
# includes it (the SQLite default already rides the entry crate).
rings = ["ring-postgres"]
